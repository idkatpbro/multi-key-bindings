name: build-1.21.11

on:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: checkout 1.21.11 branch
        uses: actions/checkout@v4
        with:
          ref: 1.21.11

      - name: setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "microsoft"

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build normal jar
        run: ./gradlew build

      - name: build obfuscated jar
        run: ./gradlew obfuscateRemappedJar

      - name: upload jars
        uses: actions/upload-artifact@v4
        with:
          name: Multi-Key-Bindings-1.21.11
          path: build/libs/*.jar
          if-no-files-found: error
