buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "com.guardsquare:proguard-gradle:7.9.1"
    }
}

plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "multi-key-bindings" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modCompileOnly files("libs/Searchables-fabric-1.21.9-1.0.2.jar")
    modCompileOnly files("libs/Controlling-fabric-1.21.9-27.0.2.jar")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}

loom {
    accessWidenerPath = file("src/main/resources/multi-key-bindings.accesswidener")
}

/*
 * Optional source-protection build.
 *
 * The normal remapped jar remains unchanged. The extra task creates a second
 * jar with project-owned implementation classes obfuscated. Mixin classes and
 * public bootstrap/config classes are retained so Fabric/Mixin discovery stays
 * stable.
 */
tasks.register("obfuscateRemappedJar", proguard.gradle.ProGuardTask) {
    dependsOn tasks.named("remapJar")

    injars(tasks.named("remapJar").flatMap { it.archiveFile })

    outjars(layout.buildDirectory.file("libs/${project.archives_base_name}-${project.mod_version}-obf.jar"))

    libraryjars(new File(System.getProperty("java.home"), "jmods/java.base.jmod"))

    dontoptimize()
    dontshrink()
    dontnote()
    dontwarn()

    keepattributes(
        "RuntimeVisibleAnnotations,RuntimeInvisibleAnnotations," +
        "RuntimeVisibleParameterAnnotations,RuntimeInvisibleParameterAnnotations," +
        "AnnotationDefault,Signature,InnerClasses,EnclosingMethod"
    )

    keepdirectories()

    // Keep Fabric/Mixin bootstrap names stable.
    keep("public class us.kenny.MultiKeyBindingClient { *; }")

    // Keep mixin classes/configuration classes stable. Their referenced Minecraft
    // targets are external and must not be renamed.
    keep("class us.kenny.mixin.** { *; }")
    keep("class us.kenny.core.controlling.** { *; }")

    // Fabric metadata and mixin configs reference the kept class names above,
    // so their resource contents do not need rewriting.
    // Rename project-owned classes/members that aren't part of Fabric discovery.
    repackageclasses("obf")

    // Keep the mod's resource metadata readable and loadable.
    keep("public class us.kenny.core.MultiKeyBindingScreen")
    keep("public class us.kenny.core.MultiKeyBinding")
    keep("public class us.kenny.core.MultiKeyBindingEntry")
    keep("public class us.kenny.core.StickyMultiKeyBinding")
}
